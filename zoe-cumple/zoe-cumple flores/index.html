    <div id="leo">

<svg viewBox="0 0 420 260" class="leo-svg">

    <!-- líneas de la constelación (conexiones exactas como tu referencia) -->
    
    <!-- El Triángulo del Cuerpo Principal (Continuo) -->
    <!-- Línea 1: Estrella izquierda a Estrella media-arriba -->
    <line class="leo-path" x1="35" y1="160" x2="120" y2="110" stroke-width="1" />
    <!-- Línea 2: Estrella media-arriba a Estrella central -->
    <line class="leo-path" x1="120" y1="110" x2="260" y2="135" stroke-width="1" />
    <!-- Línea 4: Estrella media-abajo DE VUELTA a Estrella izquierda -->
    <line class="leo-path" x1="115" y1="165" x2="35" y2="160" stroke-width="1" />
    
    <!-- Conexión del medio (Crucial) -->
    <!-- Línea 5: Estrella central a Estrella media-abajo (ya está, es la #3, pero la mantenemos para claridad) -->
    <!-- ESTA LÍNEA ES LA QUE REPLICA TU REFERENCIA ORIGINAL EXACTA -->
    <line class="leo-path" x1="115" y1="165" x2="290" y2="235" stroke-width="1" />


    <!-- La Cabeza del León (Igual que antes, está bien) -->
    <!-- Línea 6: Estrella central a Estrella superior-derecha 1 -->
    <line class="leo-path" x1="260" y1="135" x2="285" y2="75" stroke-width="1" />
    <!-- Línea 7: Estrella superior-derecha 1 a Estrella superior-derecha 2 -->
    <line class="leo-path" x1="285" y1="75" x2="350" y2="45" stroke-width="1" />
    <!-- Línea 8: Estrella superior-derecha 2 a Estrella superior-derecha 3 -->
    <line class="leo-path" x1="350" y1="45" x2="390" y2="85" stroke-width="1" />

    <!-- La Parte Trasera / Cola (Corrección de la conexión) -->
    <!-- Línea 9: Estrella central a Estrella inferior-derecha 1 -->
    <line class="leo-path" x1="260" y1="135" x2="300" y2="190" stroke-width="1" />
    <!-- Línea 10: Estrella inferior-derecha 1 a Estrella inferior-derecha 2 -->
    <line class="leo-path" x1="300" y1="190" x2="290" y2="235" stroke-width="1" />


    <!-- estrellas (Tus círculos originales) -->

    <circle class="leo-star" cx="35" cy="160" r="5" />
    <circle class="leo-star" cx="120" cy="110" r="5" />
    <circle class="leo-star" cx="115" cy="165" r="5" />

    <circle class="leo-star" cx="260" cy="135" r="5" />

    <circle class="leo-star" cx="285" cy="75" r="5" />
    <circle class="leo-star" cx="350" cy="45" r="5" />
    <circle class="leo-star" cx="390" cy="85" r="5" />

    <circle class="leo-star" cx="300" cy="190" r="5" />
    <circle class="leo-star" cx="290" cy="235" r="5" />


</svg>
